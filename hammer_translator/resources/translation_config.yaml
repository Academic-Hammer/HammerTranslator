# Safe Translation Stage configuration.
# Credentials are never stored here. Set the environment variable named by
# api_key_env before using --run.
#
# Source and target languages are passed via CLI flags (--source-language,
# --target-language) or PipelineConfig defaults; they are not stored here.
schema_version: translation-config-v1

providers:
  deepseek:
    base_url: "https://api.deepseek.com"
    model: "deepseek-flash"
    api_key_env: "TRANSLATION_API_KEY"
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
