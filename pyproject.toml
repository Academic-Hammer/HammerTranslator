[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hammer-translator"
version = "1.0.0"
description = "Local PDF parsing, translation, fixed-layout reflow, and validation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyMuPDF==1.26.6",
  "pydantic==2.14.0",
  "PyYAML==6.0.3",
  "python-dotenv==1.2.4",
  "openai==2.54.0",
  "httpx[socks]==0.28.1",
]

[project.scripts]
hammer-translator = "hammer_translator.pipeline.cli:main"
hammer-parse = "hammer_translator.parsing.cli:main"
hammer-translate = "hammer_translator.translation.cli:main"
hammer-reflow = "hammer_translator.reflow.cli:main"
hammer-mineru-adapt = "mineru_adapter.cli:main"
hammer-doctor = "hammer_translator.doctor:main"
hammer-smoke = "hammer_translator.smoke:main"

[tool.setuptools.packages.find]
include = ["hammer_translator*", "mineru_adapter*"]
namespaces = false

[tool.setuptools.package-data]
hammer_translator = [
  "resources/*.yaml",
  "resources/fonts/*.json",
  "resources/formula_runtime/*.json",
  "resources/formula_runtime/*.mjs",
]

[tool.ruff]
target-version = "py311"
line-length = 100
